[project]
name = "RAG-OERBOTJE"
version = "0.1.0"
description = "Reproducible data science notebooks for school"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dtreeviz==2.3.2",
  "jupyterlab>=4.4,<5",
  "marimo>=0.25.1,<0.26",
  "matplotlib>=3.9,<4",
  "narwhals>=1.40,<3",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "packaging>=24,<26",
  "pandas>=2.2,<3",
  "parso>=0.8,<0.9",
  "scikit-image",
  "pillow>=11,<13",
  "pvlib",
  "polars",
  "transformers",
  "semantic-kernel",
  "historicdutchweather",
  "pip>=25,<27",
  "plotly>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
  "tqdm>=4,<5",
  "ucimlrepo>=0.0.7,<1",
  "xgboost>=2.1,<4",
  "altair>=6.2.2",
  "pyarrow>=25.0.1",
  "nbconvert[webpdf]>=7.17.1",
  # Match nixpkgs' playwright-driver browsers in flake.nix.
  "playwright==1.63.0",
  "nbformat>=5.11.1",
  "anywidget>=0.11.0",
  "keras>=3.15.1",
  "tensorflow[and-cuda]>=2.21.0",
  "tensorboard>=2.21,<3",
  "sentence-transformers>=6.2.0",
]

[tool.uv]
package = false
python-preference = "only-system"

[tool.uv.sources]
historicdutchweather = { git = "https://github.com/stephanpcpeters/HourlyHistoricWeather.git", rev = "master" }

[dependency-groups]
dev = [
  "duckdb>=1.5.5",
  "polars[pyarrow]>=1.44.2",
  "pytest>=8,<9",
  "python-lsp-ruff>=2.3.4",
  "python-lsp-server>=1.15.0",
  "ruff>=0.16.6",
  "sqlglot>=30.18.0",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0.post1",
  "websockets>=17.1",
]

[tool.marimo]
formatting = "default"
