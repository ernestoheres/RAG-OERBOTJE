<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OER Botje</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #202b38; margin: 0; }
    main { max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; }
    .intro { color: #596879; }
    #messages { display: grid; gap: 1rem; margin: 2rem 0; }
    .message { padding: 1rem 1.25rem; border-radius: .75rem; background: white; overflow-wrap: anywhere; }
    .question { background: #e0ecff; }
    .message p, .source { white-space: pre-wrap; }
    .message p { margin: .5rem 0 0; }
    details { margin-top: 1rem; color: #536174; }
    summary { cursor: pointer; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; min-width: 0; padding: .8rem; border: 1px solid #aab7c4; border-radius: .5rem; font: inherit; }
    button { border: 0; border-radius: .5rem; padding: .8rem 1.2rem; background: #245ab0; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; }
    .htmx-indicator { display: none; color: #596879; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>OER Botje</h1>
    <p class="intro">Stel een vraag over de onderwijs- en examenregeling.</p>
    <div id="messages" aria-live="polite"></div>
    <form hx-post="/chat" hx-target="#messages" hx-swap="beforeend scroll:bottom"
          hx-indicator="#loading" hx-disabled-elt="find button"
          hx-on::after-request="if (event.detail.successful) this.reset()">
      <input name="question" aria-label="Je vraag" placeholder="Stel je vraag..." required autocomplete="off">
      <button type="submit">Verstuur</button>
    </form>
    <p id="loading" class="htmx-indicator" role="status">Antwoord wordt gemaakt...</p>
  </main>
</body>
</html>
